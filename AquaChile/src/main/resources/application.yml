# ============================================================================
# AquaChile - Microservicio de Evaluaciones Psicolaborales
# ----------------------------------------------------------------------------
# Parte 1: esqueleto del microservicio.
# En esta etapa la aplicación levanta con H2 en memoria para poder probar el
# endpoint de salud sin depender todavía de Supabase.
# En la Parte 2 se reemplazan las variables DB_* por las credenciales del
# Session Pooler de Supabase y se activa Flyway.
# ============================================================================

spring:
  application:
    name: AquaChile

  datasource:
    # TODO Parte 2: cambiar por jdbc:postgresql://<host>:<puerto>/postgres?sslmode=require
    url: ${DB_URL:jdbc:h2:mem:aquachile;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      # Pool pequeño: el plan Free de Supabase limita las conexiones simultáneas.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Se activa en la Parte 2, cuando existan las migraciones y la BD real.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  cors:
    # Origen del frontend (Vite). Se pueden agregar varios separados por coma.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # TODO Parte 2: mover a una variable de entorno segura.
    secret: ${JWT_SECRET:aquachile-dev-secret-cambiar-en-produccion-2026}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
